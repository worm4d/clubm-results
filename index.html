<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Club M 模拟成绩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#17202b; --muted:#5d6878; --rule:#dde2ea; --soft:#eef1f6;
  --accent:#2c56c9; --up:#0f8a6c; --down:#cf3f57; --flat:#7a6f9b; --gold:#b26b12;
  --tp:rgba(15,138,108,.12); --sl:rgba(207,63,87,.11);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#151c25; --ink:#e4e9f1; --muted:#8c98a9; --rule:#253141; --soft:#1b2430;
  --accent:#7ea3ff; --up:#34c49c; --down:#f2697f; --flat:#a99bd6; --gold:#f0b14a;
  --tp:rgba(52,196,156,.13); --sl:rgba(242,105,127,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#151c25; --ink:#e4e9f1; --muted:#8c98a9; --rule:#253141; --soft:#1b2430;
  --accent:#7ea3ff; --up:#34c49c; --down:#f2697f; --flat:#a99bd6; --gold:#f0b14a;
  --tp:rgba(52,196,156,.13); --sl:rgba(242,105,127,.12); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding:20px max(16px,env(safe-area-inset-left)) 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;margin:0;font-weight:700}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lab{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.pos{color:var(--up)} .neg{color:var(--down)}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end}
.status{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;background:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--up)} .status.bad .dot{background:var(--down)}
.hero{display:grid;grid-template-columns:minmax(220px,auto) 1fr;gap:10px 28px;align-items:center}
.hero .big{font-family:var(--f-num);font-size:38px;font-weight:600;line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.tile b{display:block;font-family:var(--f-num);font-size:17px;font-weight:600}
.tile small{color:var(--muted);font-size:11.5px}
.eqbox{position:relative;height:230px}
canvas{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px 8px;font-family:var(--f-num);font-size:11.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;border-radius:5px;padding:0 6px;border:1px solid var(--rule);color:var(--muted)}
.pill.long{color:var(--up);border-color:currentColor} .pill.short{color:var(--down);border-color:currentColor}
.pill.tp{background:var(--up);border-color:var(--up);color:var(--panel)} .pill.sl{background:var(--down);border-color:var(--down);color:var(--panel)} .pill.to{background:var(--flat);border-color:var(--flat);color:var(--panel)}
.opens{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ocard{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ocard .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mini{height:170px;position:relative}
.work{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.list{max-height:640px;overflow:auto;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;padding:8px 6px;cursor:pointer}
.item:hover{background:var(--soft)} .item[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-family:var(--f-num);font-size:12.5px} .item .u{font-family:var(--f-num);font-weight:600;grid-row:1/3;grid-column:2;align-self:center}
.item .m{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer}
.seg button:last-child{border-right:0} .seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chartbox{position:relative;height:420px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 20px;margin-top:10px;font-size:13px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--rule);padding:3px 0}
.kv span:first-child{color:var(--muted)} .kv span:last-child{font-family:var(--f-num)}
.login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:10px}
.login input{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink)}
.login button,.btn{font:inherit;font-size:14px;padding:8px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--panel);cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);font-size:12.5px;padding:4px 10px}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.empty{color:var(--muted);padding:18px 0;text-align:center}
@media (max-width:860px){.work,.grid2{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .big{font-size:30px}.chartbox{height:340px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>Club M 第4点 · 永续模拟成绩</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status"><span class="dot"></span><span id="statusTxt">载入中…</span></span>
      <button class="btn ghost" type="button" id="refresh">重新整理</button>
    </div>
  </header>

  <section class="card hero" aria-label="总结">
    <div>
      <div class="lab">模拟资金</div>
      <div class="big" id="bal">—</div>
      <div class="num" id="pnl"></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="card" aria-label="资金曲线">
    <h2>资金曲线（按平仓顺序）</h2>
    <div class="eqbox"><canvas id="eq" aria-label="资金曲线"></canvas><div class="tip" id="eqTip" hidden></div></div>
    <p class="note" id="expectNote"></p>
  </section>

  <section class="card" aria-label="持仓中">
    <h2 id="openTitle">持仓中</h2>
    <div class="opens" id="opens"></div>
  </section>

  <div class="grid2">
    <section class="card"><h2>每个币</h2><div class="tw"><table id="bySym"></table></div></section>
    <section class="card"><h2>每天（平仓日，马来西亚时间）</h2><div class="tw"><table id="byDay"></table></div></section>
  </div>

  <section class="card work" aria-label="交易">
    <div>
      <h2 id="cnt">交易</h2>
      <div class="filters"><div class="seg" id="fSym"></div><div class="seg" id="fRes"></div></div>
      <div class="list" id="list"></div>
    </div>
    <div>
      <h2 id="vttl">点左边任一单看图</h2>
      <div class="chartbox"><canvas id="cv" aria-label="K 线图"></canvas><div class="tip" id="cvTip" hidden></div></div>
      <p class="note">蓝线 = 通道（点 1–3 画出来，延长到点 4）· 绿底 = 止盈区 · 红底 = 止损区 · ✕ = 出场 · 时间是马来西亚时间</p>
      <div class="kv" id="kv"></div>
    </div>
  </section>

  <section class="card">
    <h2>最近碰线的第4点（包括没开的）</h2>
    <div class="tw" style="max-height:420px;overflow:auto"><table id="sigs"></table></div>
  </section>

  <section class="card">
    <h2>设定</h2>
    <p class="note" id="setting"></p>
  </section>
</div>

<script>
(() => {
const MY = 8 * 3600e3, M5 = 300e3, $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let D = null, SEL = null, fSym = "all", fRes = "all", VIEW = [], timer = null;
const fT = (t, y) => { const d = new Date(t + MY), p = n => String(n).padStart(2, "0"); return (y ? d.getUTCFullYear() + "-" : "") + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()); };
const fU = v => (v >= 0 ? "+" : "") + v.toFixed(1) + " U", c0 = v => v >= 0 ? "pos" : "neg";
const fP = v => { if (v == null || isNaN(v)) return "—"; const a = Math.abs(v), d = a >= 10000 ? 1 : a >= 100 ? 2 : a >= 10 ? 3 : 4; return v.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d}); };
const coin = s => String(s).split("-")[0];
const RES = r => /止盈/.test(r) ? ["tp", "止盈"] : /止损/.test(r) ? ["sl", "止损"] : ["to", "4 小时到"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// 成绩在 GitHub repo 的 data 分支（机器人写的）。网址 = 用户名.github.io/repo名/，或加 ?repo=用户名/repo名
const REPO = new URLSearchParams(location.search).get("repo") || (location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] + "/" + location.pathname.split("/").filter(Boolean)[0] : "");
const RAW = new URLSearchParams(location.search).get("raw") || `https://raw.githubusercontent.com/${REPO}/data/data/`;
const DET = {};
const getJ = async f => { const r = await fetch(RAW + f + "?t=" + Math.floor(Date.now() / 60000), {cache: "no-store"}); if (!r.ok) throw new Error(f + " → HTTP " + r.status); return r.json(); };
const detail = id => DET[id] || (DET[id] = getJ(`detail/${encodeURIComponent(id)}.json`).catch(() => null));

async function load() {
  try {
    const [res, sta] = await Promise.all([getJ("results.json"), getJ("status.json")]);
    D = {...res, ...sta, trades: res.trades, signals: res.signals};
    render();
  } catch (e) { $("statusTxt").textContent = REPO ? "还读不到成绩：" + e.message + "（机器人还没上传过？）" : "网址不对：要用 用户名.github.io/repo名/"; $("status").classList.add("bad"); }
}
$("refresh").onclick = () => load();

function render() {
  if (!D || D.empty) { $("statusTxt").textContent = "机器人还没上传过成绩"; $("status").classList.add("bad"); return; }
  const now = Date.now(), last = D.last_cycle || D.updated || 0, age = (now - last) / 60000;
  $("status").classList.toggle("bad", age > 45);
  $("statusTxt").textContent = age > 45 ? `机器人 ${Math.round(age)} 分钟没更新，可能停了` : `机器人正常 · ${Math.max(0, Math.round(age))} 分钟前回报（每 30 分钟一次）`;
  $("sub").textContent = `${(D.syms || []).map(coin).join("、")} · 5 分钟 · ${D.started || "—"} 开始 · 不下真单，用 BingX 永续 K 线模拟`;
  const T = (D.trades || []).map(r => ({...r, U: +r.U, Us: +r.U_slip002, bal: +r.balance}));
  const start = +D.start || 1000, bal = +D.balance, pnl = bal - start;
  $("bal").textContent = bal.toFixed(0) + " U"; $("bal").className = "big " + c0(pnl);
  const unreal = (D.open || []).reduce((s, p) => s + (+p.unreal_U || 0), 0);
  $("pnl").innerHTML = `<span class="${c0(pnl)}">${fU(pnl)}（${(pnl / start * 100 >= 0 ? "+" : "") + (pnl / start * 100).toFixed(1)}%）</span> · 起始 ${start} U` + ((D.open || []).length ? ` · 持仓浮动 <span class="${c0(unreal)}">${fU(unreal)}</span>` : "");
  const n = T.length, w = T.filter(t => t.U > 0), l = T.filter(t => t.U <= 0), wu = w.reduce((s, t) => s + t.U, 0), lu = l.reduce((s, t) => s + t.U, 0), us = T.reduce((s, t) => s + t.Us, 0);
  let peak = start, mdd = 0; T.forEach(t => { peak = Math.max(peak, t.bal); mdd = Math.max(mdd, (peak - t.bal) / peak); });
  const days = D.started ? Math.max(1, (now - Date.parse(D.started.replace(" ", "T") + ":00+08:00")) / 864e5) : 1;
  const ex = D.expect || {};
  const tile = (lab, val, cls, small) => `<div class="tile"><span class="lab">${lab}</span><b class="${cls || ""}">${val}</b>${small ? `<small>${small}</small>` : ""}</div>`;
  $("tiles").innerHTML = tile("平仓单数", n, "", `平均每天 ${(n / days).toFixed(2)} 单`) + tile("胜率", n ? (w.length / n * 100).toFixed(1) + "%" : "—", "", ex.win_pct ? `回测约 ${ex.win_pct}%` : "")
    + tile("赚的单", `${w.length} · +${wu.toFixed(0)} U`, "pos") + tile("亏的单", `${l.length} · ${lu.toFixed(0)} U`, "neg")
    + tile("赚 ÷ 亏", lu < 0 ? (wu / -lu).toFixed(2) : "—", wu >= -lu ? "pos" : "neg") + tile("每单平均", n ? fU(pnl / n) : "—", c0(pnl), ex.per_trade_U ? `回测约 +${ex.per_trade_U} U` : "")
    + tile("最大回撤", (mdd * 100).toFixed(1) + "%", mdd > .3 ? "neg" : "") + tile("加 0.02% 滑价", fU(us), c0(us), "止损 / 到时是市价单");
  $("expectNote").textContent = n && ex.per_trade_U ? `回测预期：${n} 单 × ${ex.per_trade_U} U ≈ ${fU(n * ex.per_trade_U)}；实际 ${fU(pnl)}。${ex.note || ""}` : (ex.note || "");
  drawEq(T, start);
  // 持仓
  const O = D.open || []; $("openTitle").textContent = `持仓中（${O.length}）`;
  $("opens").innerHTML = O.length ? O.map((p, i) => `<div class="ocard"><div class="row"><b>${coin(p.sym)} <span class="pill ${p.d === 1 ? "long" : "short"}">${p.d === 1 ? "做多" : "做空"}</span></b><span class="num ${c0(+p.unreal_U || 0)}">${p.unreal_U != null ? fU(+p.unreal_U) : "—"}</span></div>
      <div class="row num" style="font-size:12.5px"><span>进 ${fP(p.en)}</span><span>现 ${fP(p.cur)}</span><span class="neg">损 ${fP(p.sl)}</span><span class="pos">盈 ${fP(p.tp)}</span></div>
      <div class="row" style="font-size:12px;color:var(--muted)"><span>${fT(p.t_in)} 进场 · 已拿 ${Math.round((p.n || 0) * 5)} 分钟 / 最多 4 小时</span></div>
      <div class="mini"><canvas id="oc${i}"></canvas></div></div>`).join("") : `<div class="empty">现在没有持仓</div>`;
  O.forEach((p, i) => detail(p.id).then(d => { if (d && d.bars && d.bars.length && $("oc" + i)) candle($("oc" + i), {...d, exit: null, t_out: null}, null); }));
  // 每个币 / 每天
  const grp = (key) => { const m = new Map(); T.forEach(t => { const k = key(t); const g = m.get(k) || {n: 0, w: 0, u: 0}; g.n++; if (t.U > 0) g.w++; g.u += t.U; m.set(k, g); }); return m; };
  const rows = (m, lab) => `<tr><th>${lab}</th><th>单数</th><th>胜率</th><th>盈亏</th></tr>` + [...m].map(([k, g]) => `<tr><td>${esc(k)}</td><td class="num">${g.n}</td><td class="num">${(g.w / g.n * 100).toFixed(0)}%</td><td class="num ${c0(g.u)}">${fU(g.u)}</td></tr>`).join("");
  $("bySym").innerHTML = n ? rows(new Map([...grp(t => coin(t.sym))].sort()), "币") : `<tr><td class="empty">还没有平仓的单</td></tr>`;
  $("byDay").innerHTML = n ? rows(new Map([...grp(t => String(t.t_out).slice(0, 5))].sort().reverse().slice(0, 21)), "日期") : `<tr><td class="empty">—</td></tr>`;
  // 清单
  const syms = ["all", ...new Set(T.map(t => coin(t.sym)))];
  seg("fSym", syms.map(s => [s, s === "all" ? "全部币" : s]), () => fSym, v => { fSym = v; list(); });
  seg("fRes", [["all", "全部"], ["w", "赚"], ["l", "亏"]], () => fRes, v => { fRes = v; list(); });
  list();
  // 信号
  const S = (D.signals || []).slice().reverse();
  $("sigs").innerHTML = S.length ? `<tr><th>时间</th><th>币</th><th>方向</th><th>开了吗</th><th style="text-align:left">没开的原因</th></tr>` + S.map(s => `<tr><td class="num">${esc(s.time)}</td><td>${coin(s.sym)}</td><td>${s.dir === "多" ? "做多" : "做空"}</td><td>${s.taken === "1" ? '<span class="pos">开了</span>' : "没开"}</td><td style="text-align:left;white-space:normal">${esc(s.why_not)}</td></tr>`).join("") : `<tr><td class="empty">还没有</td></tr>`;
  const st = D.setting || {}, a = D.acct || {}, f = D.fee || {};
  $("setting").textContent = `碰线就进 · 止损 ${(st.sl * 100).toFixed(2)}% / 止盈 ${(st.tp * 100).toFixed(1)}% · 最长 ${(st.hold || 48) / 12} 小时 · 斜度 ${(st.slopes || []).map(([x, y]) => y == null ? `≥ ${x}%` : `${x}–${y}%`).join(" 或 ")} · 左边空 ≥ ${st.left_min} 分钟 · 15m 趋势 · 十字 < ${(st.dj_max * 100).toFixed(0)}% · 最美形态 · 每单 ${a.margin} U × ${a.lev} 倍 · 永续手续费 挂单 ${(f.maker * 100).toFixed(2)}% / 吃单 ${(f.taker * 100).toFixed(2)}% · 最后上传 ${D.updated ? fT(D.updated, true) : "—"}`;
}
function seg(id, opts, get, set) { const b = $(id); b.innerHTML = ""; opts.forEach(([v, lab]) => { const x = document.createElement("button"); x.type = "button"; x.textContent = lab; x.setAttribute("aria-pressed", String(get() === v)); x.onclick = () => { set(v); [...b.children].forEach(y => y.setAttribute("aria-pressed", "false")); x.setAttribute("aria-pressed", "true"); }; b.appendChild(x); }); }
function list() {
  VIEW = (D.trades || []).map(r => ({...r, U: +r.U})).filter(t => (fSym === "all" || coin(t.sym) === fSym) && (fRes === "all" || (fRes === "w" ? t.U > 0 : t.U <= 0))).reverse();
  $("cnt").textContent = `交易（${VIEW.length}）`;
  const box = $("list"); box.innerHTML = VIEW.length ? "" : `<div class="empty">还没有平仓的单</div>`;
  VIEW.forEach((t, i) => { const b = document.createElement("button"); b.type = "button"; b.className = "item"; b.dataset.i = i; b.setAttribute("aria-current", String(SEL && SEL.id === t.id));
    const [k, lab] = RES(t.result);
    b.innerHTML = `<span class="t">${esc(t.t_in)} · ${coin(t.sym)}</span><span class="u ${c0(t.U)}">${fU(t.U)}</span><span class="m"><span class="pill ${t.dir === "多" ? "long" : "short"}">${t.dir === "多" ? "做多" : "做空"}</span><span class="pill ${k}">${lab}</span><span class="pill">${(+t.move_pct >= 0 ? "+" : "") + (+t.move_pct).toFixed(2)}%</span></span>`;
    b.onclick = () => select(t); box.appendChild(b); });
  if (!SEL || !VIEW.some(t => t.id === SEL.id)) { if (VIEW.length) select(VIEW[0]); else { SEL = null; clearCv(); } } else select(VIEW.find(t => t.id === SEL.id));
}
function select(t) { SEL = t; [...$("list").children].forEach(b => b.setAttribute && b.setAttribute("aria-current", String(VIEW[+b.dataset.i] && VIEW[+b.dataset.i].id === t.id)));
