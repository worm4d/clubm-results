<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Club M 成绩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#17202b; --muted:#5d6878; --rule:#dde2ea; --soft:#eef1f6;
  --accent:#2c56c9; --up:#0f8a6c; --down:#cf3f57; --flat:#7a6f9b; --gold:#b26b12;
  --tp:rgba(15,138,108,.12); --sl:rgba(207,63,87,.11);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#151c25; --ink:#e4e9f1; --muted:#8c98a9; --rule:#253141; --soft:#1b2430;
  --accent:#7ea3ff; --up:#34c49c; --down:#f2697f; --flat:#a99bd6; --gold:#f0b14a;
  --tp:rgba(52,196,156,.13); --sl:rgba(242,105,127,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#151c25; --ink:#e4e9f1; --muted:#8c98a9; --rule:#253141; --soft:#1b2430;
  --accent:#7ea3ff; --up:#34c49c; --down:#f2697f; --flat:#a99bd6; --gold:#f0b14a;
  --tp:rgba(52,196,156,.13); --sl:rgba(242,105,127,.12); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding:20px max(16px,env(safe-area-inset-left)) 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;margin:0;font-weight:700}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lab{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.pos{color:var(--up)} .neg{color:var(--down)}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end}
.status{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;background:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--up)} .status.bad .dot{background:var(--down)}
.hero{display:grid;grid-template-columns:minmax(220px,auto) 1fr;gap:10px 28px;align-items:center}
.hero .big{font-family:var(--f-num);font-size:38px;font-weight:600;line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.tile{border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.tile b{display:block;font-family:var(--f-num);font-size:17px;font-weight:600}
.tile small{color:var(--muted);font-size:11.5px}
.eqbox{position:relative;height:230px}
canvas{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px 8px;font-family:var(--f-num);font-size:11.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;border-radius:5px;padding:0 6px;border:1px solid var(--rule);color:var(--muted)}
.pill.long{color:var(--up);border-color:currentColor} .pill.short{color:var(--down);border-color:currentColor}
.pill.tp{background:var(--up);border-color:var(--up);color:var(--panel)} .pill.sl{background:var(--down);border-color:var(--down);color:var(--panel)} .pill.to{background:var(--flat);border-color:var(--flat);color:var(--panel)}
.opens{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ocard{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ocard .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mini{height:170px;position:relative}
.work{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.list{max-height:640px;overflow:auto;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;padding:8px 6px;cursor:pointer}
.item:hover{background:var(--soft)} .item[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-family:var(--f-num);font-size:12.5px} .item .u{font-family:var(--f-num);font-weight:600;grid-row:1/3;grid-column:2;align-self:center}
.item .m{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer}
.seg button:last-child{border-right:0} .seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chartbox{position:relative;height:420px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 20px;margin-top:10px;font-size:13px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--rule);padding:3px 0}
.kv span:first-child{color:var(--muted)} .kv span:last-child{font-family:var(--f-num)}
.login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:10px}
.login input{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink)}
.login button,.btn{font:inherit;font-size:14px;padding:8px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--panel);cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);font-size:12.5px;padding:4px 10px}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.wallet .hero{grid-template-columns:minmax(240px,auto) 1fr}
.wallet .row2{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.wallet input{font:inherit;font-family:var(--f-num);width:90px;padding:3px 7px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink)}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%} .bar .a{background:var(--accent)} .bar .b{background:var(--gold)}
.guard{display:flex;flex-direction:column;gap:6px;font-size:13px}
.guard .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.guard .ok{color:var(--up);font-weight:600} .guard .bad{color:var(--down);font-weight:600}
.guard.alert{border-color:var(--down);box-shadow:inset 4px 0 0 var(--down)}
.guard ul{margin:2px 0 0;padding-left:18px;color:var(--ink)} .guard li{margin:1px 0}
@media (max-width:860px){.work,.grid2{grid-template-columns:1fr}.hero,.wallet .hero{grid-template-columns:1fr}.hero .big{font-size:30px}.chartbox{height:340px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>Club M 成绩</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status"><span class="dot"></span><span id="statusTxt">载入中…</span></span>
      <button class="btn ghost" type="button" id="refresh">重新整理</button>
    </div>
  </header>
  <section class="card guard" id="guard" aria-label="机器人核对">
    <div class="row"><b>机器人核对</b><span id="gA">A 组 …</span><span id="gB">B 组 …</span></div>
    <div class="row" id="gC">每日对账：载入中…</div>
    <ul id="gList" hidden></ul>
  </section>
  <section class="card wallet" aria-labelledby="wTitle">
    <div class="hero">
      <div>
        <span class="lab" id="wTitle">钱包（A 组 + B 组共用一个）</span>
        <div class="big" id="wBal">—</div>
        <div class="note" id="wSub"></div>
        <div class="bar" id="wBar" title="蓝 = A 组占用，橘 = B 组占用"></div>
      </div>
      <div class="tiles" id="wTiles"></div>
    </div>
    <div class="row2">
      <label>钱包起始 <input type="number" id="wStart" min="0" step="100"> U</label>
      <span id="wNote"></span>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="切换">
    <button type="button" role="tab" id="tabM" aria-selected="true">A 组 · 5 分钟</button>
    <button type="button" role="tab" id="tabT" aria-selected="false">B 组 · 4 小时</button>
  </nav>
  <div id="paneM">
  <section class="card hero" aria-label="总结">
    <div>
      <div class="lab">模拟资金</div>
      <div class="big" id="bal">—</div>
      <div class="num" id="pnl"></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="card" aria-label="资金曲线">
    <h2>资金曲线（按平仓顺序）</h2>
    <div class="eqbox"><canvas id="eq" aria-label="资金曲线"></canvas><div class="tip" id="eqTip" hidden></div></div>
    <p class="note" id="expectNote"></p>
  </section>

  <section class="card" aria-label="持仓中">
    <h2 id="openTitle">持仓中</h2>
    <div class="opens" id="opens"></div>
  </section>

  <div class="grid2">
    <section class="card"><h2>每个币</h2><div class="tw"><table id="bySym"></table></div></section>
    <section class="card"><h2>每天（平仓日，马来西亚时间）</h2><div class="tw"><table id="byDay"></table></div></section>
  </div>

  <section class="card work" aria-label="交易">
    <div>
      <h2 id="cnt">交易</h2>
      <div class="filters"><div class="seg" id="fSym"></div><div class="seg" id="fRes"></div></div>
      <div class="list" id="list"></div>
    </div>
    <div>
      <h2 id="vttl">点左边任一单看图</h2>
      <div class="chartbox"><canvas id="cv" aria-label="K 线图"></canvas><div class="tip" id="cvTip" hidden></div></div>
      <div class="kv" id="kv"></div>
    </div>
  </section>

  <section class="card">
    <h2>最近碰线的点</h2>
    <div class="tw" style="max-height:420px;overflow:auto"><table id="sigs"></table></div>
  </section>
  </div>

  <div id="paneT" hidden>
  <section class="card hero" aria-label="B 组总结">
    <div><div class="lab">模拟资金</div><div class="big" id="tBal">—</div><div class="num" id="tPnl"></div></div>
    <div class="tiles" id="tTiles"></div>
  </section>
  <section class="card" aria-label="B 组资金曲线">
    <h2>资金曲线（按平仓顺序）</h2>
    <div class="eqbox"><canvas id="tEq" aria-label="资金曲线"></canvas><div class="tip" id="tEqTip" hidden></div></div>
  </section>
  <section class="card"><h2 id="tOpenTitle">持仓中</h2><div class="tw"><table id="tOpen"></table></div>
    <p class="note">「线」：4 小时收盘穿过这条线就平仓；它会跟着价格移动。</p></section>
  <section class="card"><h2>每个币</h2><div class="tw"><table id="tSym"></table></div></section>
  <section class="card"><h2 id="tCnt">平仓的单</h2><div class="tw" style="max-height:520px;overflow:auto"><table id="tTr"></table></div></section>
  </div>

</div>

<script>
(() => {
const MY = 8 * 3600e3, M5 = 300e3, $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let D = null, SEL = null, fSym = "all", fRes = "all", VIEW = [], timer = null;
const fT = (t, y) => { const d = new Date(t + MY), p = n => String(n).padStart(2, "0"); return (y ? d.getUTCFullYear() + "-" : "") + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()); };
const fU = v => (v >= 0 ? "+" : "") + v.toFixed(1) + " U", c0 = v => v >= 0 ? "pos" : "neg";
const fP = v => { if (v == null || isNaN(v)) return "—"; const a = Math.abs(v), d = a >= 10000 ? 1 : a >= 100 ? 2 : a >= 10 ? 3 : 4; return v.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d}); };
const coin = s => String(s).split("-")[0];
const RES = r => /止盈/.test(r) ? ["tp", "止盈"] : /止损/.test(r) ? ["sl", "止损"] : ["to", "到时平仓"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// 成绩在 GitHub repo 的 data 分支（机器人写的）。网址 = 用户名.github.io/repo名/，或加 ?repo=用户名/repo名
const REPO = new URLSearchParams(location.search).get("repo") || (location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] + "/" + location.pathname.split("/").filter(Boolean)[0] : "");
const RAW = new URLSearchParams(location.search).get("raw") || `https://raw.githubusercontent.com/${REPO}/data/data/`;
const DET = {};
const getJ = async f => { const r = await fetch(RAW + f + "?t=" + Math.floor(Date.now() / 60000), {cache: "no-store"}); if (!r.ok) throw new Error(f + " → HTTP " + r.status); return r.json(); };
const detail = id => DET[id] || (DET[id] = getJ(`detail/${encodeURIComponent(id)}.json`).catch(() => null));

async function load() {
  try {
    const [res, sta] = await Promise.all([getJ("results.json"), getJ("status.json")]);
    D = {...res, ...sta, trades: res.trades, signals: res.signals};
    render(); renderW(); renderG();
  } catch (e) { $("statusTxt").textContent = REPO ? "还读不到成绩：" + e.message + "（机器人还没上传过？）" : "网址不对：要用 用户名.github.io/repo名/"; $("status").classList.add("bad"); }
}
$("refresh").onclick = () => { load(); loadT(); loadC(); };
let TD = null, TAB = "M";
function tab(v) { TAB = v; $("tabM").setAttribute("aria-selected", String(v === "M")); $("tabT").setAttribute("aria-selected", String(v === "T"));
  $("paneM").hidden = v !== "M"; $("paneT").hidden = v !== "T"; try { localStorage.setItem("tab", v); } catch (e) {}
  if (v === "T") { if (TD) renderT(); else loadT(); } else if (D) render(); statusLine(); }
$("tabM").onclick = () => tab("M"); $("tabT").onclick = () => tab("T");
async function loadT() { try { TD = await getJ("d20.json"); if (TAB === "T") renderT(); renderW(); renderG(); } catch (e) { TD = null; if (TAB === "T") { $("tTiles").innerHTML = `<div class="empty">还读不到 B 组成绩（${esc(e.message)}）</div>`; } } statusLine(); }
function statusLine() { if (TAB !== "T") return; if (!TD) { $("statusTxt").textContent = "B 组载入中…"; return; }
  const age = (Date.now() - TD.updated) / 60000; $("status").classList.toggle("bad", age > 60);
  $("statusTxt").textContent = age > 60 ? `B 组机器人 ${Math.round(age)} 分钟没更新，可能停了` : `B 组机器人正常 · ${Math.round(age)} 分钟前回报（每 15 分钟一次；4 小时 K 收线才开平仓）`; $("sub").textContent = `${TD.started || "—"} 开始`; }
function renderT() {
  const start = +TD.start || 1000; let run = start;
  const T = (TD.trades || []).map(r => { const U = +r.U; run += U; return {...r, U, bal: run, t_out: r.t_out}; });
  const bal = +TD.bal, pnl = bal - start, O = TD.open || [], unr = O.reduce((s, p) => s + (+p.U || 0), 0);
  $("tBal").textContent = bal.toFixed(0) + " U"; $("tBal").className = "big " + c0(pnl);
  $("tPnl").innerHTML = `<span class="${c0(pnl)}">${fU(pnl)}（${(pnl / start * 100 >= 0 ? "+" : "") + (pnl / start * 100).toFixed(1)}%）</span> · 起始 ${start} U` + (O.length ? ` · 持仓浮动 <span class="${c0(unr)}">${fU(unr)}</span>` : "");
  const n = T.length, w = T.filter(t => t.U > 0), l = T.filter(t => t.U <= 0), wu = w.reduce((a, t) => a + t.U, 0), lu = l.reduce((a, t) => a + t.U, 0);
  let peak = start, mdd = 0; T.forEach(t => { peak = Math.max(peak, t.bal); mdd = Math.max(mdd, (peak - t.bal) / peak); });
  const tile = (lab, val, cls, small) => `<div class="tile"><span class="lab">${lab}</span><b class="${cls || ""}">${val}</b>${small ? `<small>${small}</small>` : ""}</div>`;
  $("tTiles").innerHTML = tile("平仓单数", n, "", O.length ? `持仓中 ${O.length}` : "") + tile("胜率", n ? (w.length / n * 100).toFixed(1) + "%" : "—")
    + tile("赚的单", `${w.length} · +${wu.toFixed(1)} U`, "pos") + tile("亏的单", `${l.length} · ${lu.toFixed(1)} U`, "neg")
    + tile("每单平均", n ? fU(pnl / n) : "—", c0(pnl)) + tile("最大回撤", (mdd * 100).toFixed(1) + "%", mdd > .3 ? "neg" : "");
  drawEq(T, start, null, "tEq", "tEqTip");
  $("tOpenTitle").textContent = `持仓中（${O.length}）`;
  $("tOpen").innerHTML = O.length ? `<tr><th>币</th><th>方向</th><th>进场</th><th>进场价</th><th>现价</th><th>浮动</th><th>线</th><th>离线</th></tr>` + O.map(p => {
    const dist = p.xl && p.px ? Math.abs(p.px - p.xl) / p.px * 100 : null;
    return `<tr><td>${esc(p.sym)}</td><td><span class="pill ${p.d === 1 ? "long" : "short"}">${p.d === 1 ? "做多" : "做空"}</span></td><td class="num">${fT(p.t_in)}</td><td class="num">${fP(p.en)}</td><td class="num">${fP(p.px)}</td><td class="num ${c0(+p.U || 0)}">${fU(+p.U || 0)}</td><td class="num">${fP(p.xl)}</td><td class="num">${dist == null ? "—" : dist.toFixed(1) + "%"}</td></tr>`; }).join("") : `<tr><td class="empty">现在没有持仓</td></tr>`;
  const g = new Map(); T.forEach(t => { const k = t.sym; const x = g.get(k) || {n: 0, w: 0, u: 0}; x.n++; if (t.U > 0) x.w++; x.u += t.U; g.set(k, x); });
  $("tSym").innerHTML = n ? `<tr><th>币</th><th>单数</th><th>胜率</th><th>盈亏</th></tr>` + [...g].sort().map(([k, x]) => `<tr><td>${esc(k)}</td><td class="num">${x.n}</td><td class="num">${(x.w / x.n * 100).toFixed(0)}%</td><td class="num ${c0(x.u)}">${fU(x.u)}</td></tr>`).join("") : `<tr><td class="empty">还没有平仓的单</td></tr>`;
  $("tCnt").textContent = `平仓的单（${n}）`;
  $("tTr").innerHTML = n ? `<tr><th>币</th><th>方向</th><th>进场</th><th>平仓</th><th>天</th><th>进场价</th><th>平仓价</th><th>名义</th><th>盈亏</th></tr>` + T.slice().reverse().map(t => `<tr><td>${esc(t.sym)}</td><td>${esc(t.dir)}</td><td class="num">${esc(t.t_in)}</td><td class="num">${esc(t.t_out)}</td><td class="num">${(+t.days).toFixed(1)}</td><td class="num">${fP(+t.entry)}</td><td class="num">${fP(+t.exit)}</td><td class="num">${(+t.notional).toFixed(0)} U</td><td class="num ${c0(t.U)}">${fU(t.U)}</td></tr>`).join("") : `<tr><td class="empty">还没有平仓的单</td></tr>`;
}

function render() {

  ev.sort((x, y) => x[0] - y[0] || x[1] - y[1]); let cur = 0, peak = 0, peakT = null; ev.forEach(([t, m]) => { cur += m; if (cur > peak + 1e-9) { peak = cur; peakT = t; } });
  const tile = (lab, val, cls, small) => `<div class="tile"><span class="lab">${lab}</span><b class="${cls || ""}">${val}</b>${small ? `<small>${small}</small>` : ""}</div>`;
  $("wTiles").innerHTML =
      tile("已实现盈亏", fU(aR + bR), c0(aR + bR), `A ${fU(aR)} · B ${fU(bR)}`)
    + tile("持仓浮动", fU(aU + bU), c0(aU + bU), `A ${aO.length} 单 ${fU(aU)} · B ${bO.length} 单 ${fU(bU)}`)
    + tile("占用保证金", used.toFixed(1) + " U" + (bMiss ? "*" : ""), "", `A ${aM.toFixed(0)}（${aO.length} × ${AM}）· B ${bM.toFixed(1)}`)
    + tile("还可以用", free.toFixed(1) + " U", free < 0 ? "neg" : "", eq > 0 ? `占用 ${(used / eq * 100).toFixed(0)}%` : "")
    + tile("开始以来最多同时占用", peak.toFixed(1) + " U", "", peakT ? fT(peakT) : "还没开过单");
  $("wNote").innerHTML = (bMiss ? "* B 组机器人要更新到 2026-10-20a 版才会回报保证金，现在 B 组没算进去。 " : "")
    + "回测参考（2021–2026）：B 组 10 个币最多同时占用约 <b>712 U</b>（平常约 210 U），A 组最多 4 × 50 = <b>200 U</b>。两个加起来最多约 910 U，钱包要比这个多，再留回撤的空间。";
}

// ── 机器人核对：跑的版本 / 设定码 是不是预期的；每日对账结果 ──
const EXPECT = {A: {version: "2026-10-20a", fp: "d42202ee"}, B: {version: "2026-10-20c", fp: "4fd769d8"}};
let CK = null, CKerr = null;
async function loadC() { try { CK = await getJ("check.json"); CKerr = null; } catch (e) { CK = null; CKerr = e.message; } renderG(); }
function renderG() {
  const one = (g, x) => {
    if (!x) return [`${g} 组 载入中…`, false];
    if (!x.version) return [`${g} 组 <span class="bad">✗ 旧版机器人（没有回报版本）</span>`, true];
    const ok = x.version === EXPECT[g].version && x.fp === EXPECT[g].fp;
    return [`${g} 组 版本 <span class="num">${esc(x.version)}</span> · 设定码 <span class="num">${esc(x.fp)}</span> ` + (ok ? `<span class="ok">✓ 跟预期一样</span>` : `<span class="bad">✗ 预期 ${EXPECT[g].version} · ${EXPECT[g].fp}</span>`), !ok];
  };
  const [ha, ba] = one("A", D && !D.empty ? D : null), [hb, bb] = one("B", TD);
  $("gA").innerHTML = ha; $("gB").innerHTML = hb;
  let bad = ba || bb, items = [];
  if (CK) {
    const age = (Date.now() - CK.updated) / 3600e3, stale = age > 26;
    $("gC").innerHTML = `每日对账（${fT(CK.updated)}）：` + (CK.ok ? `<span class="ok">✓ 全部一样</span>` : `<span class="bad">✗ ${CK.issues.length} 个地方不一样</span>`)
      + ["a", "b"].map(k => CK[k] && CK[k].expected != null ? ` · ${k.toUpperCase()} 组 应有 ${CK[k].expected}、对上 ${CK[k].matched}` : "").join("")
      + (stale ? ` <span class="bad">（超过一天没对账，检查 iMac）</span>` : "");
    if (!CK.ok || stale) bad = true; items = CK.ok ? [] : CK.issues;
  } else $("gC").textContent = "每日对账：还没跑过" + (CKerr && !/404/.test(CKerr) ? `（${CKerr}）` : "");
  $("gList").hidden = !items.length; $("gList").innerHTML = items.slice(0, 20).map(x => `<li>${esc(x)}</li>`).join("");
  $("guard").classList.toggle("alert", bad);
}
window.addEventListener("resize", () => { if (D) render(); });
load(); loadT(); loadC(); timer = setInterval(() => { if (!document.hidden) { load(); loadT(); loadC(); } }, 120000);
try { if (localStorage.getItem("tab") === "T") tab("T"); } catch (e) {}
})();
